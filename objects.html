<!doctype html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <header class="site-header no-print" id="siteHeader"></header>
  <main class="page">
    <div class="page-inner">
      <h1>Objects in 3D</h1>
      <p class="lede" id="lede"></p>
      <div class="filters" id="filters" role="group" aria-label="Filter objects"></div>
      <div class="cards objects" id="cards"></div>

    <footer class="site-footer no-print">A free classroom resource. 3D scans come from the Smithsonian Institution and from museums on Sketchfab, and load only when you open an object. Each object lists its museum, maker, and license.</footer>
    <dialog class="obj-dialog" id="objDialog" aria-labelledby="objTitle"></dialog>
  </main>

  <script src="js/core.js"></script>
  <script src="js/objects.js"></script>
