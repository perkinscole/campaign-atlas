<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0b7a75">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign Atlas — Interactive Map</title>
  <meta name="description" content="An interactive map for the classroom: follow the armies, open each battle, and read what soldiers and commanders wrote at the time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230b7a75%27/%3E%3Cpath fill=%27%23fff%27 d=%27M16 5l3 8 8 3-8 3-3 8-3-8-8-3 8-3z%27/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main class="atlas">
    <div id="map" role="application" aria-label="Interactive map of battles and army movements"></div>

    <aside id="panel" aria-live="polite"></aside>

    <div class="timeline" role="group" aria-label="Timeline controls">
      <button id="play" class="play" aria-label="Play timeline" title="Play / pause (space)">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path class="ico-play" d="M5 3l12 7-12 7z" fill="currentColor"/><path class="ico-pause" d="M4 3h4v14H4zM12 3h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <div class="slider-wrap">
        <input type="range" id="day" min="0" max="1" value="0" step="1" aria-label="Date">
        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>
      <output class="date" id="dateLabel" for="day"></output>
      <label class="speed">Speed
        <select id="speed" aria-label="Playback speed">
          <option value="0.5">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="2">Fast</option>
          <option value="4">Very fast</option>
        </select>
      </label>
      <details class="options">
        <summary>Layers</summary>
        <div class="options-menu">
          <label><input type="checkbox" id="optA" checked> <span class="swatch side-a"></span><span id="optALabel">Army routes</span></label>
          <label><input type="checkbox" id="optB" checked> <span class="swatch side-b"></span><span id="optBLabel">Army routes</span></label>
          <label><input type="checkbox" id="optAll"> Show every battle regardless of date</label>
          <label><input type="checkbox" id="optAuto" checked> Pause and open each battle as it begins</label>
          <div class="menu-key" id="menuKey"></div>
          <div class="menu-head">Base map</div>
          <div class="base-menu" id="baseMenu"></div>
        </div>
      </details>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/index.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
