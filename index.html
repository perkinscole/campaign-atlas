<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Civil War Atlas — Interactive Map of Armies and Battles, 1861–1865</title>
  <meta name="description" content="An educational interactive map of the American Civil War: follow the movements of the major armies, open each battle, and read what soldiers and commanders wrote at the time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232b5797'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f4ecd8'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">The Civil War Atlas<small>Armies, battles, and the words of those who were there · 1861–1865</small></a>
    <nav aria-label="Site">
      <a href="index.html" class="active">Map</a>
      <a href="battles.html">Battles</a>
      <a href="sources.html">Sources</a>
    </nav>
  </header>

  <main class="atlas">
    <div id="map" role="application" aria-label="Interactive map of Civil War battles and army movements"></div>

    <aside id="panel" aria-live="polite"></aside>

    <div class="timeline" role="group" aria-label="Timeline controls">
      <button id="play" class="play" aria-label="Play timeline" title="Play / pause (space)">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path class="ico-play" d="M5 3l12 7-12 7z" fill="currentColor"/><path class="ico-pause" d="M4 3h4v14H4zM12 3h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <div class="slider-wrap">
        <input type="range" id="day" min="0" max="1" value="0" step="1" aria-label="Date">
        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>
      <output class="date" id="dateLabel" for="day">April 1, 1861</output>
      <label class="speed">Speed
        <select id="speed" aria-label="Playback speed">
          <option value="0.5">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="2">Fast</option>
          <option value="4">Very fast</option>
        </select>
      </label>
      <details class="options">
        <summary>Layers</summary>
        <div class="options-menu">
          <label><input type="checkbox" id="optUnion" checked> <span class="swatch union"></span>Union army routes</label>
          <label><input type="checkbox" id="optConf" checked> <span class="swatch confederate"></span>Confederate army routes</label>
          <label><input type="checkbox" id="optAll"> Show every battle regardless of date</label>
          <label><input type="checkbox" id="optAuto" checked> Pause and open each battle as it begins</label>
          <div class="menu-key">
            <span><i class="dot union"></i>Union victory</span>
            <span><i class="dot confederate"></i>Confederate victory</span>
            <span><i class="dot inconclusive"></i>Inconclusive</span>
          </div>
        </div>
      </details>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
